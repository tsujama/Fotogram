<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="renderImage()">
    <header>
        <img src="./assets/img/Capa_1.png">
    </header>

    <section>

        <div>
            <h1>Your personal photo album</h1>
            <div id="picWrapper"></div>
        </div>
    </section>

    <dialog id="myDialog" aria-labelledby="dialogTitle" aria-describedby="dialogDescr">
            <header>
                <h2 id="dialogTitle">
                    Bla
                </h2>
            </header>

            <section>
                <p id="dialogDescr">test.</p>
            </section>

            <footer>
                <button onclick="closeDialog()">Schließen</button>
            </footer>
        </dialog>
    
    <footer>
        <div>
            <img src="./assets/img/Logo.png">
        </div>
        <div>
            © 2023 Developer Akademie GmbH
        </div>
    </footer>

<script src="script.js"></script>
</body>
</html>
